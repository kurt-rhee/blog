<svg width="100%" viewBox="0 0 680 260" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Kurt Rhee — name rendered with solar electrical symbols</title>
  <desc>K-U-R-T  R-H-E-E with selective electrical symbols</desc>

  <!-- Drawing layers: light grey first, dark grey second so dark grey always renders on top. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
    <g id="light-grey-elements" stroke="rgb(200,200,200)">
      <path d="M111 200 Q130 200 130 175" fill="none"/>
      <line x1="130" y1="175" x2="130" y2="50"/>
      <line x1="158" y1="125" x2="158" y2="200"/>
      <path d="M158 50 Q198 50 198 87 Q198 125 158 125" fill="none"/>
      <line x1="340" y1="125" x2="340" y2="200"/>
      <path d="M340 50 Q380 50 380 87 Q380 125 340 125" fill="none"/>
      <line x1="417" y1="50" x2="417" y2="200"/>
      <line x1="495" y1="50" x2="537" y2="50"/>
      <line x1="495" y1="200" x2="537" y2="200"/>
      <line x1="555" y1="50" x2="555" y2="200"/>
      <line x1="555" y1="125" x2="562" y2="125"/>
      <line x1="590" y1="125" x2="597" y2="125"/>
      <line x1="555" y1="200" x2="570" y2="200"/>
      <line x1="582" y1="200" x2="597" y2="200"/>
    </g>

    <g id="dark-grey-elements" stroke="rgb(75,75,75)" stroke-width="3.4">
      <line x1="28" y1="50" x2="28" y2="200"/>
      <line x1="28" y1="125" x2="78" y2="50"/>
      <line x1="28" y1="125" x2="78" y2="200"/>
      <line x1="78" y1="50" x2="78" y2="175"/>
      <path d="M78 175 Q78 200 97 200" fill="none"/>
      <line x1="158" y1="50" x2="158" y2="125"/>
      <line x1="158" y1="125" x2="198" y2="125"/>
      <line x1="198" y1="125" x2="198" y2="200"/>
      <line x1="213" y1="50" x2="287" y2="50"/>
      <line x1="250" y1="50" x2="250" y2="200"/>
      <line x1="340" y1="50" x2="340" y2="125"/>
      <line x1="340" y1="125" x2="380" y2="125"/>
      <line x1="380" y1="125" x2="380" y2="200"/>
      <line x1="417" y1="125" x2="459" y2="125"/>
      <line x1="459" y1="50" x2="459" y2="200"/>
      <line x1="495" y1="50" x2="495" y2="200"/>
      <line x1="495" y1="125" x2="531" y2="125"/>
      <line x1="555" y1="50" x2="597" y2="50"/>
      <line x1="562" y1="125" x2="590" y2="125"/>
      <line x1="570" y1="200" x2="582" y2="200"/>
    </g>
  </g>

  <!-- Letter labels -->
  <text x="52" y="228" text-anchor="middle" style="fill:rgb(130,128,120);font-family:ui-monospace,monospace;font-size:11px;">K</text>
  <text x="104" y="228" text-anchor="middle" style="fill:rgb(130,128,120);font-family:ui-monospace,monospace;font-size:11px;">U</text>
  <text x="178" y="228" text-anchor="middle" style="fill:rgb(130,128,120);font-family:ui-monospace,monospace;font-size:11px;">R</text>
  <text x="250" y="228" text-anchor="middle" style="fill:rgb(130,128,120);font-family:ui-monospace,monospace;font-size:11px;">T</text>
  <text x="360" y="228" text-anchor="middle" style="fill:rgb(130,128,120);font-family:ui-monospace,monospace;font-size:11px;">R</text>
  <text x="438" y="228" text-anchor="middle" style="fill:rgb(130,128,120);font-family:ui-monospace,monospace;font-size:11px;">H</text>
  <text x="516" y="228" text-anchor="middle" style="fill:rgb(130,128,120);font-family:ui-monospace,monospace;font-size:11px;">E</text>
  <text x="576" y="228" text-anchor="middle" style="fill:rgb(130,128,120);font-family:ui-monospace,monospace;font-size:11px;">E</text>

</svg>
