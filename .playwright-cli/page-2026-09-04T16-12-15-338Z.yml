      - heading "A Photon's Journey Through a Solar Simulation" [level=1] [ref=e50]
      - paragraph [ref=e51]: A photovoltaic performance model does much more than turn sunlight into an energy estimate. It follows a chain of physical calculations from conditions above the atmosphere to the power delivered at the grid connection.
      - paragraph [ref=e52]:
        - text: This simulation uses
        - link "pvlib" [ref=e53] [cursor=pointer]:
          - /url: https://pvlib-python.readthedocs.io/
        - text: to follow that journey from sunlight to grid-delivered electricity.
