      - heading "The three sections" [level=2] [ref=e56]
      - paragraph [ref=e57]: "The journey is divided into three physical sections:"
      - list [ref=e58]:
        - listitem [ref=e59]:
          - strong [ref=e60]: "Atmosphere:"
          - text: solar position, air mass, water vapor, and the separation of measured sunlight into direct and diffuse components.
        - listitem [ref=e61]:
          - strong [ref=e62]: "DC:"
          - text: tracker geometry, irradiance on the module, shading, reflection, spectral response, cell temperature, diode behavior, degradation, and direct-current wiring.
        - listitem [ref=e63]:
          - strong [ref=e64]: "AC:"
          - text: inverter conversion, alternating-current wiring, transformer loss, and the final grid export limit.
      - paragraph [ref=e65]: Use the timeline, controls, or arrow keys to inspect individual calculations, or let the complete journey play automatically.