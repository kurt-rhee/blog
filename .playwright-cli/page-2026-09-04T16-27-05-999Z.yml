      - heading "The three sections" [level=2] [ref=f12e59]
      - paragraph [ref=f12e60]: "The journey is divided into three physical sections:"
      - list [ref=f12e61]:
        - listitem [ref=f12e62]:
          - strong [ref=f12e63]: "Atmosphere:"
          - text: solar position, air mass, water vapor, and the separation of measured sunlight into direct and diffuse components.
        - listitem [ref=f12e64]:
          - strong [ref=f12e65]: "DC:"
          - text: tracker geometry, irradiance on the module, shading, reflection, spectral response, cell temperature, diode behavior, degradation, and direct-current wiring.
        - listitem [ref=f12e66]:
          - strong [ref=f12e67]: "AC:"
          - text: inverter conversion, alternating-current wiring, transformer loss, and the final grid export limit.
      - paragraph [ref=f12e68]: Use the timeline, controls, or arrow keys to inspect individual calculations, or let the complete journey play automatically.