      - heading "A Photon's Journey Through a Solar Simulation" [level=1] [ref=f12e53]
      - paragraph [ref=f12e54]: A photovoltaic performance model does much more than turn sunlight into an energy estimate. It follows a chain of physical calculations from conditions above the atmosphere to the power delivered at the grid connection.
      - paragraph [ref=f12e55]:
        - text: This simulation uses
        - link "pvlib" [ref=f12e56] [cursor=pointer]:
          - /url: https://pvlib-python.readthedocs.io/
        - text: to follow that journey from sunlight to grid-delivered electricity.
