      - heading "The three sections" [level=2] [ref=f8e59]
      - paragraph [ref=f8e60]: "The journey is divided into three physical sections:"
      - list [ref=f8e61]:
        - listitem [ref=f8e62]:
          - strong [ref=f8e63]: "Atmosphere:"
          - text: solar position, air mass, water vapor, and the separation of measured sunlight into direct and diffuse components.
        - listitem [ref=f8e64]:
          - strong [ref=f8e65]: "DC:"
          - text: tracker geometry, irradiance on the module, shading, reflection, spectral response, cell temperature, diode behavior, degradation, and direct-current wiring.
        - listitem [ref=f8e66]:
          - strong [ref=f8e67]: "AC:"
          - text: inverter conversion, alternating-current wiring, transformer loss, and the final grid export limit.
      - paragraph [ref=f8e68]: Use the timeline, controls, or arrow keys to inspect individual calculations, or let the complete journey play automatically.