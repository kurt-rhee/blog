      - heading "The three sections" [level=2] [ref=f4e17]
      - paragraph [ref=f4e18]: "The journey is divided into three physical sections:"
      - list [ref=f4e19]:
        - listitem [ref=f4e20]:
          - strong [ref=f4e21]: "Atmosphere:"
          - text: solar position, air mass, water vapor, and the separation of measured sunlight into direct and diffuse components.
        - listitem [ref=f4e22]:
          - strong [ref=f4e23]: "DC:"
          - text: tracker geometry, irradiance on the module, shading, reflection, spectral response, cell temperature, diode behavior, degradation, and direct-current wiring.
        - listitem [ref=f4e24]:
          - strong [ref=f4e25]: "AC:"
          - text: inverter conversion, alternating-current wiring, transformer loss, and the final grid export limit.
      - paragraph [ref=f4e26]: Use the timeline, controls, or arrow keys to inspect individual calculations, or let the complete journey play automatically.