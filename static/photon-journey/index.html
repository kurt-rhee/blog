<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An animated journey through a pvlib-based solar simulation.">
  <meta property="og:title" content="A photon through a pvlib simulation">
  <meta property="og:description"
    content="Follow one photon through a pvlib-based solar simulation.">
  <meta property="og:type" content="website">
  <meta property="og:url"
    content="https://kurt-rhee.github.io/blog/photon-journey/">
  <link rel="canonical"
    href="https://kurt-rhee.github.io/blog/photon-journey/">
  <title>A photon through a pvlib simulation</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f5ef;
      --muted: #a7adba;
      --panel: rgba(15, 22, 36, .86);
      --line: rgba(255, 255, 255, .12);
      --sun: #ffd166;
      --photon: #fff4a8;
      --electric: #5eead4;
      --blue: #78a6ff;
      --violet: #bd9cff;
      --shadow: 0 24px 80px rgba(0, 0, 0, .38);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 72% 12%, rgba(70, 104, 168, .17), transparent 34rem),
        radial-gradient(circle at 15% 85%, rgba(19, 134, 122, .1), transparent 30rem),
        #070b12;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, select { font: inherit; }

    .shell {
      width: min(1440px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px clamp(18px, 4vw, 64px) 24px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 24px;
    }

    header, .brand, .controls, .step-meta, .legend, .model-line {
      display: flex;
      align-items: center;
    }

    header { justify-content: space-between; gap: 24px; }
    .brand { gap: 14px; }

    .mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 209, 102, .35);
      border-radius: 50%;
      background: rgba(255, 209, 102, .08);
      color: var(--sun);
      box-shadow: inset 0 0 22px rgba(255, 209, 102, .08);
    }

    h1 { margin: 0; font: 600 clamp(20px, 2.3vw, 30px)/1.1 Georgia, serif; letter-spacing: -.02em; }
    .eyebrow { margin: 0 0 5px; color: var(--sun); font-size: 10px; font-weight: 750; letter-spacing: .18em; text-transform: uppercase; }
    .controls { gap: 9px; }

    .control {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .055);
      color: var(--ink);
      padding: 8px 14px;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .2s;
    }

    .control:hover { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .25); }
    .control:active { transform: scale(.97); }
    .control.primary { background: var(--ink); color: #0c111b; border-color: var(--ink); font-weight: 700; }
    select.control { appearance: none; padding-right: 16px; }

    main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(300px, .8fr);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      background: rgba(9, 14, 24, .76);
      box-shadow: var(--shadow);
    }

    .visual {
      position: relative;
      min-height: 550px;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: linear-gradient(165deg, rgba(16, 29, 49, .9), rgba(7, 11, 18, .98) 68%);
    }

    .visual::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }

    .scene-label {
      position: absolute;
      z-index: 3;
      top: 24px;
      left: 26px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(7, 11, 18, .55);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    svg { width: 100%; height: 100%; position: absolute; inset: 0; }
    .route { fill: none; stroke: rgba(255,255,255,.13); stroke-width: 2; stroke-dasharray: 4 8; }
    .category-boundary { stroke-width: 1.5; transition: fill .35s, stroke .35s, filter .35s; }
    .category-boundary.active { fill: rgba(255,255,255,.055); stroke: rgba(255,255,255,.55); filter: drop-shadow(0 0 10px rgba(255,255,255,.08)); }
    .category-title { fill: #f4f6fb; font-size: 14px; font-weight: 750; letter-spacing: .15em; text-anchor: middle; }
    .category-subtitle { fill: #7f8796; font-size: 10px; letter-spacing: .08em; text-anchor: middle; }
    .device-rail { stroke: rgba(255,255,255,.12); stroke-width: 2; }
    .node { opacity: .48; transition: opacity .35s, filter .35s; }
    .node.active { opacity: 1; filter: drop-shadow(0 0 12px rgba(255,255,255,.18)); }
    .node-label { fill: #a7adba; font-size: 11px; text-anchor: middle; letter-spacing: .07em; text-transform: uppercase; }
    .node.active .node-label { fill: #fff; }
    .photon-glow { fill: var(--photon); opacity: .28; }
    #particle { fill: var(--photon); transition: fill .45s; }
    #particle.electric { fill: var(--electric); }
    #particleGlow.electric { fill: var(--electric); }
    #stepIllustration { pointer-events: none; color: var(--sun); filter: drop-shadow(0 0 8px rgba(255, 209, 102, .4)); }
    #stepIllustration.electric { color: var(--electric); filter: drop-shadow(0 0 8px rgba(94, 234, 212, .4)); }
    .step-illustration-art { color: inherit; }

    .legend {
      position: absolute;
      z-index: 3;
      left: 26px;
      bottom: 22px;
      gap: 17px;
      color: var(--muted);
      font-size: 11px;
    }

    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--photon); box-shadow: 0 0 10px currentColor; }
    .dot.electric { background: var(--electric); }

    aside {
      min-height: 550px;
      padding: clamp(28px, 4vw, 50px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--panel);
    }

    .step-meta { justify-content: space-between; margin-bottom: 28px; color: var(--muted); font-size: 12px; }
    .step-number { font-variant-numeric: tabular-nums; letter-spacing: .08em; }
    .state { padding: 5px 9px; border: 1px solid currentColor; border-radius: 999px; color: var(--sun); }
    .state.electric { color: var(--electric); }
    h2 { min-height: 2.25em; margin: 0 0 15px; font: 500 clamp(30px, 4vw, 52px)/1.05 Georgia, serif; letter-spacing: -.035em; }
    .explanation { min-height: 5.2em; margin: 0 0 28px; color: #c1c6d0; font-size: 15px; line-height: 1.62; }

    .model-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255, 255, 255, .035);
    }

    .model-card > p { margin: 0 0 13px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; }
    .model-list { min-height: 74px; display: grid; gap: 9px; }
    .model-line { justify-content: space-between; gap: 14px; font-size: 13px; }
    .model-line span:first-child { color: var(--muted); }
    .model-name { color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; }
    .note { min-height: 2.8em; margin: 18px 0 0; color: #858d9c; font-size: 11px; line-height: 1.45; }

    footer { display: grid; gap: 13px; }
    .progress { height: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
    .progress-bar { width: 0; height: 100%; background: linear-gradient(90deg, var(--sun), var(--electric)); transition: width .55s cubic-bezier(.2,.7,.2,1); }
    .timeline { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-color: #3a4352 transparent; }

    .step-button {
      flex: 0 0 148px;
      min-width: 0;
      padding: 10px 8px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: #737c8d;
      background: transparent;
      font-size: 11px;
      text-align: left;
      cursor: pointer;
      transition: color .2s, background .2s, border-color .2s;
    }

    .step-button strong { display: block; margin-bottom: 4px; color: inherit; font-size: 9px; letter-spacing: .08em; }
    .step-button.active { color: var(--ink); background: rgba(255,255,255,.055); border-color: var(--line); }
    .step-button.visited { color: #aeb5c2; }

    @media (max-width: 860px) {
      .shell { min-height: auto; }
      header { align-items: flex-start; }
      .controls { flex-wrap: wrap; justify-content: flex-end; }
      main { grid-template-columns: 1fr; }
      .visual { min-height: 390px; border-right: 0; border-bottom: 1px solid var(--line); }
      aside { min-height: 410px; }
      .timeline { display: flex; }
    }

    @media (max-width: 560px) {
      .shell { padding: 17px 12px; }
      header { display: grid; }
      .controls { justify-content: flex-start; }
      .visual { min-height: 330px; }
      aside { min-height: 440px; padding: 28px 22px; }
      .timeline { display: flex; overflow-x: auto; padding-bottom: 4px; }
      .step-button { min-width: 112px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true">☼</div>
        <div>
          <p class="eyebrow">pvlib · solar simulation</p>
          <h1>A photon’s journey to the grid</h1>
        </div>
      </div>
      <div class="controls" aria-label="Animation controls">
        <button class="control" id="previousButton" type="button" aria-label="Previous modeling step">← Previous</button>
        <button class="control primary" id="playButton" type="button">Pause</button>
        <button class="control" id="nextButton" type="button" aria-label="Next modeling step">Next →</button>
        <button class="control" id="restartButton" type="button">Restart</button>
        <select class="control" id="speedSelect" aria-label="Animation speed">
          <option value="6500">Slow</option>
          <option value="4200" selected>Normal</option>
          <option value="2400">Fast</option>
        </select>
      </div>
    </header>

    <main>
      <section class="visual" aria-label="Animated photon path">
        <div class="scene-label" id="sceneLabel">Meteorology</div>

      },
      {
        phase: "Power conversion", short: "Inverter", title: "Convert direct current to alternating current",
        explanation: "Direct-current operating voltage and power pass through the inverter’s measured performance curve. Nominal direct and alternating power, nominal voltage, startup power, four curve coefficients, and night tare determine output and clipping.",
        models: [["Default", "Sandia inverter"], ["Inputs", "Vdc · Pdc · equipment coefficients"], ["Output", "AC power"]],
        note: "pvlib.inverter.sandia. PVWatts is implemented as an alternate with 96% nominal efficiency.", point: [716,418], node: 6, state: "electric"
      },
      {
        phase: "AC delivery", short: "AC wiring", title: "Apply inverter-to-transformer wiring loss",
        explanation: "Alternating-current wiring loss grows with the square of inverter power and is normalized by nominal inverter power. The current hard-coded full-power loss is 0%, making this stage neutral today.",
        models: [["Method", "quadratic power loss"], ["Formula", "P² ÷ Pnom × loss fraction"], ["Current setting", "0% at full power"]],
        note: "Function: TransformerWiring.", point: [752,429], node: 6, state: "electric"
      },
      {
        phase: "AC delivery", short: "Transformer", title: "Apply transformer losses",
        explanation: "The transformer subtracts its constant no-load loss and its load-dependent loss as power passes to a higher-voltage collection system. Nameplate rating sets the loading basis.",
        models: [["Model", "pvlib simple efficiency"], ["Inputs", "power · no-load loss · load loss · rating"], ["Output", "transformer output power"]],
        note: "pvlib.transformer.simple_efficiency. Transformer grouping is omitted.", point: [790,444], node: 7, state: "electric"
      },
      {
        phase: "Grid", short: "POI limit", title: "Enforce the grid export limit",
        explanation: "The summed project power is bounded between zero and the point-of-interconnection export limit. Zero output is represented as missing; positive power below the limit passes through unchanged.",
        models: [["Method", "lower and upper clipping"], ["Bounds", "0 W · project POI limit"], ["Output", "exported project power"]],
        note: "Function: ProjectPowerAfterClipping. Project summation is omitted as requested; this is the final physical constraint.", point: [811,457], node: 7, state: "electric"
      }
    ];

    const categoryTracks = [
      { name: "atmosphere", start: 0, end: 8, from: 70, to: 270 },
      { name: "dc", start: 9, end: 34, from: 325, to: 625 },
      { name: "ac", start: 35, end: 38, from: 690, to: 850 }
    ];

    categoryTracks.forEach(category => {
      const distance = category.end - category.start;
      for (let index = category.start; index <= category.end; index += 1) {
        const progress = distance ? (index - category.start) / distance : 0;
        steps[index].point = [category.from + (category.to - category.from) * progress, 288];
        steps[index].category = category.name;
      }
    });

    const stepIcons = [
      "icon-pressure", "icon-solar-position", "icon-relative-airmass",
      "icon-absolute-airmass", "icon-dew-point", "icon-water-column",
      "icon-extra-dni", "icon-direct", "icon-diffuse", "icon-control",
      "icon-pitch", "icon-angles", "icon-reverse", "icon-selection",
      "icon-sky", "icon-ground", "icon-beam", "icon-rear", "icon-sum",
      "icon-direct-shade", "icon-cell-shade", "icon-diffuse-shade",
      "icon-rear-loss", "icon-soiling", "icon-direct-reflection",
      "icon-diffuse-reflection", "icon-spectrum", "icon-effective",
      "icon-temperature", "icon-diode", "icon-iv-curve", "icon-degradation",
      "icon-string", "icon-dc-wire-one", "icon-dc-wire-two", "icon-inverter",
      "icon-ac-wire", "icon-transformer", "icon-grid"
    ];

    const title = document.querySelector("#stepTitle");
    const explanation = document.querySelector("#stepExplanation");
    const modelList = document.querySelector("#modelList");
    const note = document.querySelector("#stepNote");
    const stepNumber = document.querySelector("#stepNumber");
    const stateLabel = document.querySelector("#stateLabel");
    const particle = document.querySelector("#particle");
    const particleGlow = document.querySelector("#particleGlow");
    const stepIllustration = document.querySelector("#stepIllustration");
    const stepIllustrationArt = document.querySelector("#stepIllustrationArt");
    const progressBar = document.querySelector("#progressBar");
    const timeline = document.querySelector("#timeline");
    const playButton = document.querySelector("#playButton");
    const previousButton = document.querySelector("#previousButton");
    const nextButton = document.querySelector("#nextButton");
    const restartButton = document.querySelector("#restartButton");
    const speedSelect = document.querySelector("#speedSelect");
    const sceneLabel = document.querySelector("#sceneLabel");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let current = 0;
    let playing = !reduceMotion;
    let timer;
    let animation;

    steps.forEach((step, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "step-button";
      button.innerHTML = `<strong>${String(index + 1).padStart(2, "0")} · ${step.phase}</strong>${step.short}`;
      button.addEventListener("click", () => {
        showStep(index);
        schedule();
      });
      timeline.append(button);
    });

    function moveParticle(from, to) {
      animation?.cancel();
      const [fromX, fromY] = steps[from].point;
      const [toX, toY] = steps[to].point;
      if (reduceMotion || from === to) {
        particle.setAttribute("cx", toX);
        particle.setAttribute("cy", toY);
        particleGlow.setAttribute("cx", toX);
        particleGlow.setAttribute("cy", toY);
        return;
      }
      const duration = Math.min(1100, Number(speedSelect.value) * .32);
      const keyframes = [
        { transform: `translate(${fromX - toX}px, ${fromY - toY}px)` },
        { transform: "translate(0, 0)" }
      ];
      particle.setAttribute("cx", toX);
      particle.setAttribute("cy", toY);
      particleGlow.setAttribute("cx", toX);
      particleGlow.setAttribute("cy", toY);
      animation = particle.animate(keyframes, { duration, easing: "cubic-bezier(.4,0,.2,1)" });
      particleGlow.animate(keyframes, { duration, easing: "cubic-bezier(.4,0,.2,1)" });
    }

    function showStep(index) {
      const previous = current;
      current = index;
      const step = steps[index];
      title.textContent = step.title;
      stepIllustrationArt.setAttribute("href", `#${stepIcons[index]}`);
      stepIllustration.setAttribute("transform", `translate(${step.point[0]} ${step.point[1]})`);
      if (!reduceMotion) {
        stepIllustration.animate(
          [{ opacity: 0 }, { opacity: 1 }],
          { duration: 420, easing: "ease-out" }
        );
      }
      explanation.textContent = step.explanation;
      note.textContent = step.note;
      stepNumber.textContent = `${String(index + 1).padStart(2, "0")} / ${String(steps.length).padStart(2, "0")}`;
      stateLabel.textContent = step.state === "photon" ? "PHOTON" : "ELECTRICAL ENERGY";
      sceneLabel.textContent = step.phase;
      document.querySelectorAll(".category-boundary").forEach(boundary => {
        boundary.classList.toggle("active", boundary.dataset.category === step.category);
      });
      stateLabel.classList.toggle("electric", step.state === "electric");
      stepIllustration.classList.toggle("electric", step.state === "electric");
      particle.classList.toggle("electric", step.state === "electric");
      particleGlow.classList.toggle("electric", step.state === "electric");
      modelList.replaceChildren(...step.models.map(([label, model]) => {
        const row = document.createElement("div");
        row.className = "model-line";
        const labelElement = document.createElement("span");
        labelElement.textContent = label;
        const modelElement = document.createElement("span");
        modelElement.className = "model-name";
        modelElement.textContent = model;
        row.append(labelElement, modelElement);
        return row;
      }));
      document.querySelectorAll(".node").forEach((node, nodeIndex) => node.classList.toggle("active", nodeIndex === step.node));
      document.querySelectorAll(".step-button").forEach((button, buttonIndex) => {
        button.classList.toggle("active", buttonIndex === index);
        button.classList.toggle("visited", buttonIndex < index);
        button.setAttribute("aria-current", buttonIndex === index ? "step" : "false");
      });
      progressBar.style.width = `${(index / (steps.length - 1)) * 100}%`;
      document.querySelector(".step-button.active")?.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest", inline: "center" });
      moveParticle(previous, index);
    }

    function schedule() {
      window.clearTimeout(timer);
      if (!playing) return;
      timer = window.setTimeout(() => {
        showStep((current + 1) % steps.length);
        schedule();
      }, Number(speedSelect.value));
    }

    playButton.addEventListener("click", () => {
      playing = !playing;
      playButton.textContent = playing ? "Pause" : "Play";
      schedule();
    });

    previousButton.addEventListener("click", () => {
      showStep((current - 1 + steps.length) % steps.length);
      schedule();
    });

    nextButton.addEventListener("click", () => {
      showStep((current + 1) % steps.length);
      schedule();
    });

    restartButton.addEventListener("click", () => {
      showStep(0);
      playing = true;
      playButton.textContent = "Pause";
      schedule();
    });

    speedSelect.addEventListener("change", schedule);
    window.addEventListener("keydown", event => {
      if (event.key === "ArrowRight") showStep((current + 1) % steps.length);
      if (event.key === "ArrowLeft") showStep((current - 1 + steps.length) % steps.length);
    });

    if (reduceMotion) playButton.textContent = "Play";
    showStep(0);
    schedule();
  </script>
</body>
</html>
